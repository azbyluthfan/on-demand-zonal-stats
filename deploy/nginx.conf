# Round-robin load balancer in front of the two API replicas.
upstream api {
    server api1:8080 max_fails=2 fail_timeout=5s;
    server api2:8080 max_fails=2 fail_timeout=5s;
}

server {
    listen 8080;
    client_max_body_size 4m;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;            # > QUERY_TIMEOUT (30s)
        proxy_next_upstream error timeout; # retry another replica if one is down
        add_header X-Upstream $upstream_addr always;
    }
}
